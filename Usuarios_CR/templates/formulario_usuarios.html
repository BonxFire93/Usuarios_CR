<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Crear nuevo usuario</h1>
    <form action="{{ url_for('nuevo_usuario') }}" method="POST">
        <label for="input_nombre">Nombre:</label>
        <br>
        <input type="text" id="input_nombre" name="nombre" required>
        <br>
        <label for="input_apellido">Apellido:</label>
        <br>
        <input type="text" id="input_apellido" name="apellido" required>
        <br>
        <label for="input_email">Email:</label>
        <br>
        <input type="email" id="input_email" name="email" required>
        <br>
        <input type="submit" value="Crear">
        <br>
    </form>
</body>
</html>
