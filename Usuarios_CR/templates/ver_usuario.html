<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario {{ usuario.id }}</title>
</head>
<body>
    <h1>Usuario {{ usuario.id }}</h1>
    <p><strong>Nombre completo:</strong> {{ usuario.nombre }} {{ usuario.apellido }}</p>
    <p><strong>E-mail:</strong> {{ usuario.email }}</p>
    <p><strong>Fecha de creación:</strong> {{ usuario.created_at }}</p>
    <p><strong>Fecha de actualización:</strong> {{ usuario.updated_at }}</p>
    <a href="{{ url_for('formulario_editar_usuario', usuario_id=usuario.id) }}">Editar</a>
    <a href="{{ url_for('borrar_usuario', usuario_id=usuario.id) }}">Borrar</a>
    <p><a href="{{ url_for('index') }}">Volver a usuarios</a></p>
</body>
</html>
