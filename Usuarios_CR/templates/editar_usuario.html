<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario {{ usuario.id }}</title>
</head>
<body>
    <h1>Editar usuario {{ usuario.id }}</h1>
    <form action="{{ url_for('actualizar_usuario', usuario_id=usuario.id) }}" method="POST">
        <label for="input_nombre">Nombre:</label><br>
        <input type="text" id="input_nombre" name="nombre" value="{{ usuario.nombre }}" required><br>
        <label for="input_apellido">Apellido:</label><br>
        <input type="text" id="input_apellido" name="apellido" value="{{ usuario.apellido }}" required><br>
        <label for="input_email">E-mail:</label><br>
        <input type="email" id="input_email" name="email" value="{{ usuario.email }}" required><br>
        <button type="submit">Actualizar</button>
    </form>
    <p><a href="{{ url_for('index') }}">Volver a usuarios</a></p>
</body>
</html>
